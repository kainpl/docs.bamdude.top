name: ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build:
    name: mkdocs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the sitemap's <lastmod> is each page's last commit
          # (hooks/sitemap_lastmod.py). On the default shallow checkout every
          # file dates to HEAD and the build writes no lastmod at all.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build deps
        run: pip install -r requirements.txt

      # --strict turns broken cross-links + missing-anchor warnings into
      # build failures so they don't reach main and end up live.
      - name: Build (strict)
        run: mkdocs build --strict

      # The header mark, the tab icons and the JSON-LD Organization.logo are
      # the docs' only visible identity; the last must equal the landing's URL
      # character for character (both sites declare the same @id).
      #
      # The three brand/ paths are the landing's own, deliberately: the two
      # sites declare the same files under the same names so a docs tab and a
      # bamdude.top tab are the same picture. Moving one without the other is
      # what this step is here to catch — it caught exactly that on 2026-09-20.
      - name: Identity is wired into the built index
        run: |
          for needle in 'assets/logo.svg' 'brand/svg/mark-adaptive.svg' 'brand/favicon.ico' 'brand/png/apple-touch-icon.png' 'https://bamdude.top/brand/png/icon-tile-512.png'; do
            grep -q -- "$needle" site/index.html || { echo "missing in site/index.html: $needle" >&2; exit 1; }
          done
