name: ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build:
    name: mkdocs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the sitemap's <lastmod> is each page's last commit
          # (hooks/sitemap_lastmod.py). On the default shallow checkout every
          # file dates to HEAD and the build writes no lastmod at all.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build deps
        run: pip install -r requirements.txt

      # --strict turns broken cross-links + missing-anchor warnings into
      # build failures so they don't reach main and end up live.
      - name: Build (strict)
        run: mkdocs build --strict
