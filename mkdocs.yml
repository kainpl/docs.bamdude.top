site_name: BamDude Documentation
site_description: Self-hosted 3D print farm management for Bambu Lab printers
# Canonical URL — populates <link rel="canonical"> + sitemap absolute paths.
site_url: https://docs.bamdude.top/
# Pages still link back to the source-code repo (issues / releases live there);
# the docs repo is separate but is what the "Edit this page" button targets.
repo_url: https://github.com/kainpl/bamdude
repo_name: kainpl/bamdude
# "Edit this page" — opens the matching .md in the docs repo for community PRs.
edit_uri: https://github.com/kainpl/docs.bamdude.top/edit/main/docs/

# A link to a heading that does not exist is reported at INFO by default, so it
# scrolls past in a normal build and `--strict` never sees it. Eleven had
# accumulated that way by 2026-08-16: several written as though a heading's
# `:material-icon:` shortcode were part of the slug (it is not — the icon is an
# SVG by the time the anchor is taken), and two Ukrainian pages pointing at
# English anchors, which look right and go nowhere.
#
# `warn` plus the `--strict` the deploy already uses makes each one a build
# failure, so the next is caught by CI instead of by a reader.
validation:
  anchors: warn
  unrecognized_links: warn

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    # `search.share` is deliberately absent. Material rewrites the share
    # button's href to `<page>?q=<query>` on every query emission — including
    # the empty one fired the moment the dialog mounts — so every rendered page
    # carries an `<a href="…?q=">`. Googlebot executes the JS and harvested one
    # such URL per page (Search Console 2026-09-06: eight of them, filed as
    # "alternate page with proper canonical"). The canonical kept them out of
    # the index, but each was a crawl spent on nothing. Deep links (`?q=term`)
    # still open the dialog pre-filled without the button; only the copy-link
    # icon is gone.
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

